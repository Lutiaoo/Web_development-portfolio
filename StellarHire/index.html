<!DOCTYPE html>
	<html lang="en">
		<head>
			<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
			<title>StellarHire</title>
			<link rel="stylesheet" href="css/style.css">
			<link rel="preconnect" href="https://fonts.googleapis.com">
			<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
			<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
			<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
		</head>
		<body>
			<div class="container">
				<!-- Navigation -->
				<nav class="nav">
					<!-- Logo -->
					<div class="nav__logo">
						<img src="images/logo.jpg" alt="StellarHire Logo" class="nav__logo-image">
					</div>
					<!-- Navigation Panel -->
					<div class="nav__navigation">
							<a href="#" class="nav__link">Platform</a>
							<a href="#" class="nav__link">Pricing</a>
							<a href="#" class="nav__link">Resources</a>
							<a href="#" class="nav__link">About Us</a>
					</div>
					<!-- Actions(Sign In and Book a Demo) -->
					<div class="nav__actions">
						<button class="nav__button">Sign In</button>
						<button class="nav__button">Book a Demo</button>
					</div>
				</nav>
				<!-- Main -->
				<main class="main">
					<!-- Text with info -->
					<div class="main__info">
						<div class="main__info-hiring">
							<p class="main__info-header">
								Hire world-class<br>
								talent faster
							</p>
							<p class="main__info-subheader">
								To build a global team, you need a<br>
								modern, customizable all in one hiring<br>
								platform. We offer the expertise, tools,<br>
								and technology to hire for what's next.
							</p>
							<!-- CTA(Call to actions buttons) -->
							<div class="main__info-cta">
								<button class="main__cta-button">Browse Solution</button>
								<a href="#" class="main__cta-hyperlink">Talk to an expert</a>
							</div>
						</div>
						<!-- Photo of expert -->
						<div class="main__photo">
							<img src="images/hero-image.jpg" alt="Image of the expert" class="main__photo-image">
						</div>
					</div>
					<!-- List of companies that trusted -->
					<div class="main__trust">
						<p class="main__trust-header">
							Thousand of companies trust StellarHire
						</p>
						<!-- List of companies with arrows -->
						<div class="main__trust-list">
							<img src="images/arrow-left.svg" alt="Arrow Left" class="main__trust-arrow">
							<img src="images/buggsy-logo.svg" alt="Buggsy Logo" class="main__trust-companies">
							<img src="images/prestoproject-logo.svg" alt="PrestoProject Logo" class="main__trust-companies">
							<img src="images/everlearn-logo.svg" alt="EverLearn Logo" class="main__trust-companies">
							<img src="images/mandatory-logo.svg" alt="Mandatory Logo" class="main__trust-companies">
							<img src="images/shortly-logo.svg" alt="Shortly Logo" class="main__trust-companies">
							<img src="images/arrow-right.svg" alt="Arrow Right" class="main__trust-arrow">
						</div>
					</div>
				</main>
			</div>
		</body>
	</html>
